spring.application.name=Simple Search Engine

# PostgreSQL Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Disable favicon errors
spring.mvc.log-resolved-exception=false

# HTTP Timeout Configuration (for long-running operations)
# Async request timeout: 10 minutes (600000ms)
spring.mvc.async.request-timeout=600000
# Tomcat connection timeout: 10 minutes (600000ms)
server.tomcat.connection-timeout=600000

